name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/jalebi

  homebrew-smoke-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: Install Jalebi from Homebrew tap
        run: brew install --cask bhardwaj-shubham/tap/jalebi

      - name: Verify installation
        run: |
          jalebi --version
          jalebi --help
