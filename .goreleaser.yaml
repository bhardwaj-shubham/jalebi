# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: jalebi

builds:
  - id: jalebi
    main: ./cmd/jalebi
    binary: jalebi

    env:
      - CGO_ENABLED=0

    ldflags:
      - -s -w
      - -X github.com/bhardwaj-shubham/jalebi/internal/cli.version={{ .Version }}

    goos:
      - linux
      - windows
      - darwin

    goarch:
      - amd64
      - arm64

    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^build:"
      - "^Merge"
  groups:
    - title: "Features"
      regexp: "^.*?(feat)(\\(.*\\))?!?:.+$"
      order: 0

    - title: "Bug Fixes"
      regexp: "^.*?(fix)(\\(.*\\))?!?:.+$"
      order: 1

    - title: "Refactoring"
      regexp: "^.*?(refactor)(\\(.*\\))?!?:.+$"
      order: 2

    - title: "Other Changes"
      order: 999

release:
  github:
    owner: bhardwaj-shubham
    name: jalebi
  draft: false
  prerelease: auto
  name_template: "Release v{{ .Version }}"
  header: |
    ## What's Changed in v{{ .Version }}

  footer: |
    ---
    ### Installation & Verification

    Download the archive for your operating system and architecture.

    Verify checksums with `sha256sum --check checksums.txt` on Linux
    or macOS. On Windows, use `Get-FileHash` in PowerShell to verify
    SHA-256 hashes against `checksums.txt`.

homebrew_casks:
  - name: jalebi
    repository:
      owner: bhardwaj-shubham
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

    directory: Casks
    homepage: https://github.com/bhardwaj-shubham/jalebi
    description: "A CLI for analyzing codebases locally."

winget:
  - name: jalebi
    package_name: Jalebi
    package_identifier: ItsB.Jalebi
    publisher: ItsB
    publisher_url: https://github.com/bhardwaj-shubham
    publisher_support_url: https://github.com/bhardwaj-shubham/jalebi/issues
    license: MIT
    license_url: https://github.com/bhardwaj-shubham/jalebi/blob/main/LICENSE
    homepage: https://github.com/bhardwaj-shubham/jalebi
    short_description: "A CLI for analyzing codebases locally."
    description: "Analyze codebases locally by inspecting files, languages, and code tags."
    tags:
      - cli
      - developer-tools
      - golang
    skip_upload: auto
    repository:
      owner: bhardwaj-shubham
      name: winget-pkgs
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      branch: "jalebi-{{ .Version }}"
      pull_request:
        enabled: true
        draft: false
        token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
